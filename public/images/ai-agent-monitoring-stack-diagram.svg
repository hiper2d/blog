<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#9fb0c6"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#e0a23d"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="880" fill="#0e1b2e"/>

  <!-- launchd timer -->
  <rect x="480" y="26" width="280" height="46" rx="23" fill="#16273d" stroke="#324c6b"/>
  <text x="620" y="55" text-anchor="middle" fill="#d8e0ec" font-size="19">launchd timer &#183; every 20 min</text>
  <line x1="620" y1="72" x2="620" y2="98" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- outer driver box -->
  <rect x="34" y="98" width="1172" height="624" rx="14" fill="none" stroke="#33507a" stroke-width="1.5"/>
  <text x="58" y="130" fill="#93a4bb" font-size="17" font-style="italic">tick.sh &#8212; the 20-minute driver</text>

  <!-- self-audit (OUTSIDE the session) -->
  <rect x="64" y="150" width="320" height="138" rx="11" fill="#16273d" stroke="#e0a23d" stroke-width="1.8"/>
  <text x="84" y="184" fill="#e0a23d" font-size="20" font-weight="600">&#9312; self-audit</text>
  <text x="84" y="214" fill="#9fb0c6" font-size="15">runs before the lock,</text>
  <text x="84" y="236" fill="#9fb0c6" font-size="15">outside the Claude session</text>
  <text x="84" y="268" fill="#d8e0ec" font-size="15">did every job fire? crash? stuck?</text>

  <!-- jobs -->
  <rect x="784" y="150" width="318" height="128" rx="11" fill="#16273d" stroke="#324c6b"/>
  <text x="804" y="182" fill="#d8e0ec" font-size="18" font-weight="600">jobs &#183; cron schedules</text>
  <text x="804" y="212" fill="#9fb0c6" font-size="14.5">monitor_keys &#183; monitor_health</text>
  <text x="804" y="234" fill="#9fb0c6" font-size="14.5">monitor_betterstack &#183; monitor_cloudflare</text>
  <text x="804" y="256" fill="#9fb0c6" font-size="14.5">scrape_stats &#183; werewolf_stats</text>

  <!-- queue -->
  <path d="M820,322 q0,-13 123,-13 q123,0 123,13 l0,50 q0,13 -123,13 q-123,0 -123,-13 Z" fill="#16273d" stroke="#324c6b"/>
  <ellipse cx="943" cy="322" rx="123" ry="13" fill="#16273d" stroke="#324c6b"/>
  <text x="943" y="366" text-anchor="middle" fill="#d8e0ec" font-size="17">queue &#183; due tasks</text>

  <!-- scheduler.pick -->
  <rect x="492" y="330" width="252" height="74" rx="11" fill="#16273d" stroke="#324c6b"/>
  <text x="618" y="362" text-anchor="middle" fill="#d8e0ec" font-size="18" font-weight="600">scheduler.pick</text>
  <text x="618" y="387" text-anchor="middle" fill="#9fb0c6" font-size="14.5">highest-priority task</text>

  <!-- arrows: jobs -> queue -> scheduler -> session -->
  <line x1="943" y1="278" x2="943" y2="305" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="820" y1="356" x2="748" y2="368" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="618" y1="404" x2="618" y2="448" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Claude session (the loop) -->
  <rect x="160" y="448" width="858" height="218" rx="12" fill="#11203a" stroke="#6f86a3" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="182" y="478" fill="#ccd6e6" font-size="17" font-weight="600">claude -p &#183; the loop</text>
  <text x="358" y="478" fill="#9fb0c6" font-size="14.5" font-style="italic">one task per tick, then exits</text>

  <rect x="198" y="500" width="312" height="74" rx="9" fill="#16273d" stroke="#324c6b"/>
  <text x="354" y="544" text-anchor="middle" fill="#d8e0ec" font-size="16.5">run the task&#8217;s handler</text>

  <rect x="550" y="500" width="312" height="74" rx="9" fill="#16273d" stroke="#324c6b"/>
  <text x="706" y="534" text-anchor="middle" fill="#d8e0ec" font-size="16.5">tools</text>
  <text x="706" y="556" text-anchor="middle" fill="#9fb0c6" font-size="14">API &#183; browser &#183; Telegram</text>

  <line x1="510" y1="537" x2="544" y2="537" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="198" y="592" width="664" height="58" rx="9" fill="#16273d" stroke="#e0a23d" stroke-width="1.8"/>
  <text x="530" y="628" text-anchor="middle" fill="#e0a23d" font-size="16.5" font-weight="600">&#9313; worklog + result + checkpoint</text>
  <line x1="706" y1="574" x2="706" y2="590" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- feedback: a long task checkpoints and resumes on the next tick -->
  <path d="M862,620 C 1040,620 1196,565 1196,475 L1196,415 C1196,392 1140,384 1052,380" fill="none" stroke="#e0a23d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowAmber)"/>
  <text x="1092" y="440" text-anchor="middle" fill="#e0a23d" font-size="14">long task not done?</text>
  <text x="1092" y="461" text-anchor="middle" fill="#e0a23d" font-size="14">checkpoint, then</text>
  <text x="1092" y="482" text-anchor="middle" fill="#e0a23d" font-size="14">resume next tick</text>

  <!-- Telegram -->
  <rect x="492" y="756" width="252" height="74" rx="11" fill="#16273d" stroke="#324c6b"/>
  <text x="618" y="788" text-anchor="middle" fill="#d8e0ec" font-size="18" font-weight="600">Telegram</text>
  <text x="618" y="812" text-anchor="middle" fill="#9fb0c6" font-size="14.5">your phone</text>

  <!-- session -> telegram -->
  <line x1="618" y1="666" x2="618" y2="754" stroke="#9fb0c6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="632" y="716" fill="#9fb0c6" font-size="14.5">digest / urgent</text>

  <!-- self-audit -> telegram (out of session, down the left margin) -->
  <path d="M92,288 L92,793 L488,793" fill="none" stroke="#e0a23d" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="120" y="742" fill="#e0a23d" font-size="14">out-of-session escalation</text>

  <!-- legend -->
  <text x="42" y="862" fill="#e0a23d" font-size="15">&#9312; outside the session: a broken loop can&#8217;t silence it</text>
  <text x="660" y="862" fill="#e0a23d" font-size="15">&#9313; inside the loop: it watches its own last step</text>
</svg>
